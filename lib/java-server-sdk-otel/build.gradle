plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id "maven-publish"
    id "signing"
    id "io.github.gradle-nexus.publish-plugin" version "1.3.0"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    mavenLocal()
    maven { url "https://oss.sonatype.org/content/groups/public/" }
}

allprojects {
    group = 'com.launchdarkly'
    version = "${version}"
    archivesBaseName = 'launchdarkly-java-server-sdk-otel'
    sourceCompatibility = 1.8
    targetCompatibility = 1.8
}

ext.otelVersion = "1.33.0"

dependencies {
    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.opentelemetry:opentelemetry-sdk:${otelVersion}"
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:${otelVersion}"
    testImplementation "com.launchdarkly:test-helpers:2.1.0"

    // Prototype: the SDK version that provides the hook handlers, published to the local Maven repository.
    implementation "com.launchdarkly:launchdarkly-java-server-sdk:7.17.1-metrics"
    // The metrics hook needs batch callbacks (1.15) and histogram bucket advice (1.32).
    implementation "io.opentelemetry:opentelemetry-api:${otelVersion}"
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name.set("LaunchDarkly Java Server Otel Integration")
                description.set("This package can be used to integrate OpenTelemetry with the LaunchDarkly Java Server SDK.")
                url.set("https://github.com/launchdarkly/java-core")
                licenses {
                    license {
                        name.set("The Apache License, Version 2.0")
                        url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                    }
                }
                developers {
                    developer {
                        name.set("LaunchDarkly SDK Team")
                        email.set("sdks@launchdarkly.com")
                    }
                }
                scm {
                    connection.set("scm:git:git://github.com/launchdarkly/java-core.git")
                    developerConnection.set("scm:git:ssh:git@github.com:launchdarkly/java-core.git")
                    url.set("https://github.com/launchdarkly/java-core")
                }
            }
        }
    }
}

nexusPublishing {
    clientTimeout = java.time.Duration.ofMinutes(2) // we've seen extremely long delays in creating repositories
    repositories {
        sonatype{
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
        }
    }
}

signing {
    sign(publishing.publications["mavenJava"])
}
